<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>My Components</title>
<style>
:root{
  --bg:#F6F7F9;--card:#FFFFFF;--line:#E3E6EB;--ink:#1A1D23;--ink2:#6B7280;--ink3:#9AA1AC;
  --blue:#2563EB;--blue-soft:#EAF0FE;--green:#0E9F6E;--green-soft:#E6F6F0;
  --amber:#C2760B;--amber-soft:#FDF3E3;--red:#DC2626;--red-soft:#FDECEC;--r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:680px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:18px;font-weight:700;flex:1}
header .icobtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
header .icobtn svg{width:19px;height:19px;stroke:var(--ink2);fill:none;stroke-width:1.8}
main{padding:14px 16px 100px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);max-width:680px;margin:0 auto}
nav button{background:none;border:0;padding:9px 1px;color:var(--ink3);font-size:10px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--blue)}
.total{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.total .lbl{font-size:13px;color:var(--ink2)}
.total .amt{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.total .sub{font-size:13px;color:var(--ink3)}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 8px;text-align:center}
.tile b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--ink2)}
h2{font-size:13px;font-weight:700;color:var(--ink2);margin:22px 0 9px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:10px;margin-bottom:8px}
.row .tap{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;
  text-align:left;font:inherit;color:inherit;cursor:pointer}
.thumb{width:54px;height:54px;flex:0 0 54px;border-radius:10px;background:#F1F3F6;border:1px solid var(--line);
  display:grid;place-items:center;overflow:hidden;position:relative;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg.sym{width:40px;height:28px;stroke:#7C8598;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.thumb .cam{position:absolute;right:-1px;bottom:-1px;width:20px;height:20px;border-radius:6px;background:var(--blue);display:grid;place-items:center}
.thumb .cam svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2}
.info{flex:1;min-width:0}
.info .nm{font-size:15px;font-weight:600;line-height:1.25}
.info .ln{font-size:12.5px;color:var(--ink2);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pr{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;text-align:right}
.pr small{display:block;font-size:11px;font-weight:500;color:var(--ink3)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.t-have{background:var(--green-soft);color:var(--green)}
.t-need{background:var(--blue-soft);color:var(--blue)}
.t-bad{background:var(--red-soft);color:var(--red)}
.t-warn{background:var(--amber-soft);color:var(--amber)}
.t-gray{background:#EFF1F4;color:var(--ink2)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  font-size:15px;color:var(--ink);margin-bottom:10px;font-family:inherit}
.search::placeholder{color:var(--ink3)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-size:13px;
  font-weight:500;padding:8px 14px;border-radius:20px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);color:#fff;border:0;
  border-radius:10px;padding:14px 16px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.grn{background:var(--green)}
.btn.red{background:var(--card);border:1px solid var(--red);color:var(--red)}
.btn.wide{width:100%}
.btn:active{opacity:.85}
.btnrow{display:flex;gap:9px;margin-top:10px}
.btnrow .btn{flex:1}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:16px 0 6px}
input.f,select.f,textarea.f{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:13px;font-size:16px;color:var(--ink);font-family:inherit}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
textarea.f{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pfx{position:relative}
.pfx span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:16px}
.pfx input{padding-left:28px}
.seg{display:grid;grid-auto-flow:column;gap:8px}
.seg button{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:13px 4px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.seg.g button.on{background:var(--green);border-color:var(--green)}
.seg.r button.on{background:var(--red);border-color:var(--red)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  font-size:22px;cursor:pointer;color:var(--ink);font-family:inherit}
.stepper input{flex:1;text-align:center;font-weight:700}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none}
.sheet.open{display:block}
.sheet-in{max-width:680px;margin:0 auto;padding:0 16px 40px}
.sheet-top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:5;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.sheet-top .x{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:18px;cursor:pointer;line-height:1;color:var(--ink);font-family:inherit}
.sheet-top .t{font-size:16px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.hero .pic{aspect-ratio:4/3;background:#F1F3F6;display:grid;place-items:center}
.hero .pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.hero .pic .symbox{display:grid;place-items:center;gap:10px;padding:20px}
.hero .pic .symbox svg{width:min(48vw,180px);height:auto;stroke:#6B7280;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.hero .pic .symbox .cap{font-size:13px;color:var(--ink2);font-weight:600;text-align:center}
.thumb svg.art{width:100%;height:100%;display:block}
.hero .pic{position:relative}
.hero .pic .artbox{display:grid;place-items:center;gap:6px;padding:12px 14px 16px}
.hero .pic .artbox svg.art{width:min(62vw,260px);height:auto}
.hero .pic .artbox .cap{font-size:13px;color:var(--ink2);font-weight:600;text-align:center}
.hero .pic .symtag{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 7px 3px 4px;
  font-size:10.5px;color:var(--ink2);font-weight:600}
.hero .pic .symtag svg{width:30px;height:20px;stroke:#6B7280;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hero .acts{display:flex;border-top:1px solid var(--line)}
.hero .acts button{flex:1;background:none;border:0;border-right:1px solid var(--line);padding:14px 4px;
  font-size:13.5px;font-weight:600;color:var(--blue);cursor:pointer;font-family:inherit}
.hero .acts button:last-child{border-right:0}
.hero .acts button.dgr{color:var(--red)}
.pinbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px}
.pinbox .h{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:10px}
.pinbox svg{width:100%;height:auto}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink2);flex:0 0 40%}
.kv .v{text-align:right;flex:1;font-weight:500}
.empty{text-align:center;padding:56px 24px}
.empty h3{font-size:17px;margin:0 0 8px}
.empty p{font-size:14px;color:var(--ink2);margin:0 0 20px;line-height:1.55}
.ghead{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 9px}
.ghead .a{font-size:13px;font-weight:700}
.ghead .b{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:7px;background:#EDEFF3;border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.fab{position:fixed;right:16px;bottom:82px;z-index:35;height:50px;padding:0 20px;border-radius:25px;background:var(--blue);
  color:#fff;border:0;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,.35);
  display:flex;align-items:center;gap:6px;font-family:inherit}
@media(min-width:681px){.fab{right:calc(50vw - 324px)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;font-size:14px;
  padding:12px 18px;border-radius:10px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">My Components</h1>
    <button class="icobtn" id="moreBtn"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
  </header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<button class="fab" id="fab">+ Add</button>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="globalCam" accept="image/*" hidden>

<script>
const SYM={
 res:'<path d="M2 16h8l3-8 5 16 5-16 5 16 3-8h8"/>',
 pot:'<path d="M2 22h8l3-8 5 16 5-16 5 16 3-8h8"/><path d="M24 2v8"/><path d="M20 10h8l-4 4z" fill="currentColor"/>',
 capc:'<path d="M2 16h16M30 16h16"/><path d="M18 4v24M30 4v24"/>',
 cape:'<path d="M2 16h16M30 16h16"/><path d="M18 4v24"/><path d="M30 6c-4 3-4 17 0 20"/><path d="M8 8h6M11 5v6"/>',
 ind:'<path d="M2 20h6"/><path d="M8 20a5 5 0 0110 0M18 20a5 5 0 0110 0M28 20a5 5 0 0110 0"/><path d="M38 20h8"/>',
 diode:'<path d="M2 16h14M32 16h14"/><path d="M16 6v20l16-10z"/><path d="M32 6v20"/>',
 zener:'<path d="M2 16h14M32 16h14"/><path d="M16 6v20l16-10z"/><path d="M32 6v20M32 6h-5M32 26h5"/>',
 led:'<path d="M2 16h14M32 16h14"/><path d="M16 6v20l16-10z"/><path d="M32 6v20"/><path d="M34 8l6-5M38 12l6-5"/>',
 bjt:'<circle cx="26" cy="16" r="13"/><path d="M6 16h9M15 8v16M15 12l10-6M15 20l10 6"/>',
 fet:'<circle cx="26" cy="16" r="13"/><path d="M6 16h9M15 8v16M19 9v14M19 12h9M19 20h9M28 6v20"/>',
 dip8:'<rect x="9" y="5" width="30" height="22" rx="2"/><path d="M13 5V2M19 5V2M25 5V2M31 5V2M13 27v3M19 27v3M25 27v3M31 27v3"/><circle cx="14" cy="10" r="1.6"/>',
 dip14:'<rect x="5" y="5" width="38" height="22" rx="2"/><path d="M9 5V2M15 5V2M21 5V2M27 5V2M33 5V2M39 5V2M9 27v3M15 27v3M21 27v3M27 27v3M33 27v3M39 27v3"/><circle cx="10" cy="10" r="1.6"/>',
 opamp:'<path d="M14 3v26l22-13z"/><path d="M2 10h12M2 22h12M36 16h10"/><path d="M17 11h4M17 20h4M19 18v4"/>',
 to220:'<rect x="14" y="4" width="20" height="14" rx="1"/><circle cx="24" cy="8" r="2"/><path d="M14 18h20v4H14z"/><path d="M19 22v8M24 22v8M29 22v8"/>',
 board:'<rect x="4" y="4" width="40" height="24" rx="3"/><rect x="16" y="11" width="16" height="10" rx="1"/><path d="M8 8h4M8 12h4M8 16h4M8 20h4M8 24h4M36 8h4M36 12h4M36 16h4M36 20h4M36 24h4"/>',
 mcu:'<rect x="10" y="6" width="28" height="20" rx="2"/><rect x="17" y="12" width="14" height="8" rx="1"/><path d="M10 10H4M10 16H4M10 22H4M38 10h6M38 16h6M38 22h6"/>',
 sensor:'<rect x="8" y="8" width="20" height="16" rx="2"/><circle cx="18" cy="16" r="4"/><path d="M28 16h6M34 10c5 4 5 8 0 12M39 6c7 6 7 14 0 20"/>',
 module:'<rect x="5" y="6" width="38" height="20" rx="2"/><path d="M11 6v20M11 11h26M11 16h26M11 21h26"/>',
 relay:'<rect x="6" y="7" width="22" height="18" rx="2"/><path d="M10 12h14M10 20h14"/><path d="M28 12h6l8-5M28 20h14"/>',
 motor:'<circle cx="20" cy="16" r="12"/><path d="M14 20l6-12 6 12"/><path d="M17 16h6"/><path d="M32 13h10M32 19h10"/>',
 disp:'<rect x="6" y="5" width="36" height="22" rx="2"/><path d="M13 11h8M13 16h14M13 21h10"/>',
 seg:'<path d="M16 6h14M14 8v8M32 8v8M16 18h14M14 20v8M32 20v8M16 30h14"/>',
 xtal:'<path d="M2 16h10M36 16h10"/><path d="M12 8v16M36 8v16"/><rect x="17" y="7" width="14" height="18" rx="1"/>',
 batt:'<path d="M2 16h8M38 16h8"/><path d="M10 8v16M18 11v10M26 8v16M34 11v10"/>',
 sw:'<circle cx="10" cy="20" r="2"/><circle cx="38" cy="20" r="2"/><path d="M2 20h6M40 20h6"/><path d="M11 19l24-11"/>',
 buzz:'<circle cx="20" cy="16" r="11"/><circle cx="20" cy="16" r="3"/><path d="M34 10c4 4 4 8 0 12M39 6c7 6 7 14 0 20"/>',
 xfmr:'<path d="M14 4v24M34 4v24"/><path d="M14 8a5 5 0 000 8M14 16a5 5 0 000 8"/><path d="M34 8a5 5 0 010 8M34 16a5 5 0 010 8"/><path d="M22 4v24M26 4v24"/>',
 bread:'<rect x="4" y="4" width="40" height="24" rx="2"/><path d="M4 14h40M4 18h40"/><path d="M10 6v6M16 6v6M22 6v6M28 6v6M34 6v6M10 20v6M16 20v6M22 20v6M28 20v6M34 20v6"/>',
 wire:'<path d="M2 22c8 0 8-12 16-12s8 12 16 12 8-12 12-12"/><circle cx="4" cy="22" r="2"/><circle cx="44" cy="10" r="2"/>',
 conn:'<rect x="6" y="9" width="30" height="14" rx="2"/><path d="M36 12h8M36 20h8"/><path d="M12 9v14M18 9v14M24 9v14M30 9v14"/>',
 tool:'<path d="M30 4a8 8 0 00-9 12L6 31l4 4 15-15a8 8 0 0011-11l-6 6-5-1-1-5z"/>',
 meter:'<rect x="7" y="4" width="34" height="24" rx="3"/><rect x="12" y="9" width="24" height="8" rx="1"/><circle cx="18" cy="23" r="2"/><circle cx="30" cy="23" r="2"/>',
 iron:'<path d="M4 28l10-10"/><path d="M14 18l16-14 8 8-14 16z"/><path d="M20 12l8 8"/>',
 scope:'<rect x="4" y="5" width="40" height="22" rx="3"/><path d="M9 18c4 0 4-7 8-7s4 12 8 12 4-9 7-9 3 4 6 4"/>',
 psu:'<rect x="4" y="6" width="40" height="20" rx="3"/><path d="M11 12h12v8H11z"/><circle cx="32" cy="16" r="4"/>',
 ic:'<rect x="9" y="5" width="30" height="22" rx="2"/><path d="M15 5V2M23 5V2M31 5V2M15 27v3M23 27v3M31 27v3"/><circle cx="14" cy="10" r="1.6"/>'};
const sym=(k,c)=>'<svg class="'+(c===''?'':'sym')+'" viewBox="0 0 48 32">'+(SYM[k]||SYM.ic)+'</svg>';

/* ================= default component pictures =================
   Draws a realistic package picture for every part, from its own
   symbol key + name. No network, no stored bytes. Used wherever
   the user has not added their own photo. */
const AC={blk:'#282C31',blk2:'#3C424A',ink:'#0E1114',pin:'#BAC1C9',pin2:'#8D949D',
 sil:'#C7CDD4',sil2:'#9AA2AB',gold:'#D2AC3E',grn:'#1E6B45',grn2:'#2A8557',
 blu:'#1F4E9C',blu2:'#2E6FB8',tea:'#00979D',red:'#D2402F',wht:'#EEF0F3',
 ylw:'#E8B31E',beige:'#D8C3A0',cop:'#B87333',glass:'#0F1418',pad:'#E4E7EB'};

const _r=(x,y,w,h,f,rx,op)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx||0}" fill="${f}"${op!=null?` fill-opacity="${op}"`:''}/>`;
const _c=(x,y,r,f,op)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${op!=null?` fill-opacity="${op}"`:''}/>`;
const _e=(x,y,rx,ry,f,op)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}"${op!=null?` fill-opacity="${op}"`:''}/>`;
const _p=(d,f,s,w)=>`<path d="${d}"${f?` fill="${f}"`:' fill="none"'}${s?` stroke="${s}" stroke-width="${w||2}" stroke-linecap="round"`:''}/>`;
const _tx=(s,x,y,sz,f,a)=>s?`<text x="${x}" y="${y}" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="${sz}" font-weight="700" fill="${f}" text-anchor="${a||'middle'}" letter-spacing=".4">${esc(s)}</text>`:'';
const _legs=(xs,y1,y2,w,c)=>xs.map(x=>_r(x-(w||4.4)/2,y1,w||4.4,y2-y1,c||AC.pin,1)).join('');
const _gloss=(x,y,w,h)=>_r(x,y,w,h,'#FFFFFF',3,.07);
const _fit=(t,w,max)=>Math.max(7,Math.min(max||14,w/(Math.max(1,t.length)*.66)));

/* pick a printable part marking out of the name: "NE555 timer" -> NE555 */
function _mark(n){
  const bad=/^(\d+(\.\d+)?)(v|w|a|ma|mm|k|m|f|uf|nf|pf|awg|mhz|khz|hz|x|pcs)?$/i;
  for(const raw of String(n).split(/[\s,\/]+/)){
    const w=raw.replace(/[()]/g,'');
    if(w.length<2||w.length>11)continue;
    if(!/\d/.test(w))continue;
    if(bad.test(w))continue;
    return w.toUpperCase();
  }
  return '';
}
function _boardLab(n){
  const P=['ESP32-CAM','ESP32-S3','ESP32-C3','ESP32-C6','ESP8266','ESP32','Tang Nano','Zero 2','Pico 2','Pico',
   'Blue Pill','Black Pill','Nucleo','STM32','Teensy','Uno','Nano','Mega','EPM240','nRF52840','CH32V003',
   'AT89S52','ATtiny85','ATmega328P','Raspberry','Arduino'];
  for(const k of P){if(new RegExp(k.replace(/[-]/g,'\\-'),'i').test(n))return k.toUpperCase();}
  return (_mark(n)||String(n).split(' ')[0]).toUpperCase().slice(0,9);
}
function _pins(it){
  const hay=(it.d||'')+' '+it.n;
  let m=hay.match(/(?:DIP|SOIC|SOP|PDIP)[\s-]?(\d{1,2})/i)||hay.match(/(\d{1,2})[\s-]?pin/i);
  if(m)return Math.max(4,Math.min(40,+m[1]));
  const k=Object.keys(PINS).filter(k=>it.n.toUpperCase().indexOf(k.toUpperCase())>=0)[0];
  if(k&&PINS[k].length>3)return PINS[k].length;
  return it.s==='dip8'||it.s==='opamp'?8:14;
}
function _ohms(n){
  const m=String(n).match(/(\d+(?:\.\d+)?)\s*(k|m)?\s*(?:ohm|Ω|R\b)/i);
  if(!m)return null;
  let v=parseFloat(m[1]);
  if(/k/i.test(m[2]||''))v*=1e3; if(/m/i.test(m[2]||''))v*=1e6;
  return v;
}
const _BAND=['#17191C','#6B3A16','#C0392B','#DE7B1E','#E3C31C','#2E8B45','#2A5FB8','#7B4FA8','#8C9196','#F2F4F6'];
function _bands(v){
  if(v==null||v<=0)return [_BAND[1],_BAND[0],_BAND[3],AC.gold];
  const e=Math.floor(Math.log10(v));
  let mant=Math.round(v/Math.pow(10,e-1));
  if(mant>99){mant=Math.round(mant/10)}
  const d1=Math.floor(mant/10),d2=mant%10,mul=Math.max(0,Math.min(9,e-1));
  return [_BAND[d1],_BAND[d2],_BAND[mul],AC.gold];
}
function _ledCol(n){
  const s=n.toLowerCase();
  if(/\bir\b|infrared|tsop/.test(s))return ['#3C2A57','#5A4080'];
  if(/rgb/.test(s))return ['#C8CDD4','#E4E8EC'];
  if(/ws2812|neopixel/.test(s))return ['#E9ECEF','#FFFFFF'];
  if(/laser/.test(s))return ['#C0392B','#E4574A'];
  if(/green/.test(s))return ['#2FA85A','#57D183'];
  if(/blue/.test(s))return ['#2E6FB8','#5C9BE0'];
  if(/white/.test(s))return ['#DFE3E8','#FFFFFF'];
  if(/yellow/.test(s))return ['#E0B31C','#F3D45A'];
  return ['#CE3A2C','#EE6A5A'];
}

/* resolver: symbol key first, then a few name overrides */
function pkgOf(it){
  const s=it.s||'ic',n=(it.n||'').toLowerCase();
  if(/^(dip8|dip14|ic|opamp)$/.test(s)&&/module|board/.test(n))return PKG.module;
  if(s==='to220'&&/tl431/.test(n))return PKG.to92;
  if(s==='res'&&/thermistor|ntc|fuse|ptc/.test(n))return PKG.diode;
  if(s==='board'&&/esp32-cam/.test(n))return PKG.mcu;
  return PKG[s]||PKG.ic;
}
function art(it){
  let body='';
  try{body=pkgOf(it)(it)}catch(e){body=PKG.ic(it)}
  return `<svg class="art" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}

const DB={db:null,mem:{},ok:false};
function dbOpen(){return new Promise(r=>{try{if(!indexedDB)return r(false);
 const q=indexedDB.open('bench2',1);
 q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
 q.onsuccess=e=>{DB.db=e.target.result;DB.ok=true;r(true)};q.onerror=()=>r(false);
 setTimeout(()=>r(DB.ok),1200)}catch(e){r(false)}})}
function dbGet(k){return new Promise(r=>{if(!DB.ok)return r(DB.mem[k]??null);
 try{const t=DB.db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>r(t.result??null);t.onerror=()=>r(null)}catch(e){r(null)}})}
function dbSet(k,v){DB.mem[k]=v;return new Promise(r=>{if(!DB.ok)return r(1);
 try{const t=DB.db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>r(1);t.onerror=()=>r(0)}catch(e){r(0)}})}
function dbDel(k){delete DB.mem[k];return new Promise(r=>{if(!DB.ok)return r();
 try{const t=DB.db.transaction('kv','readwrite').objectStore('kv').delete(k);t.onsuccess=()=>r();t.onerror=()=>r()}catch(e){r()}})}

let S={u:{},custom:[],photos:{},projects:[],view:'home',f:{cat:'',q:''}};
const $=s=>document.querySelector(s);
const all=()=>CATALOG.concat(S.custom);
const byId=id=>all().find(x=>x.i===id);
const U=id=>S.u[id]||{};
const st=id=>U(id).st||'';
const qty=id=>{const u=U(id);return u.qty!==undefined?u.qty:1};
const price=id=>{const u=U(id);return u.price!==undefined?u.price:(byId(id)?byId(id).p:0)};
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const save=async()=>{await dbSet('u',S.u);await dbSet('custom',S.custom);await dbSet('proj',S.projects)};

async function boot(){
  await dbOpen();
  S.u=(await dbGet('u'))||{};S.custom=(await dbGet('custom'))||[];S.projects=(await dbGet('proj'))||[];
  const ix=(await dbGet('pix'))||[];
  for(const id of ix){const p=await dbGet('p:'+id);if(p)S.photos[id]=p}
  render();
}
async function setPhoto(id,d){S.photos[id]=d;await dbSet('p:'+id,d);await dbSet('pix',Object.keys(S.photos))}
async function delPhoto(id){delete S.photos[id];await dbDel('p:'+id);await dbSet('pix',Object.keys(S.photos))}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1700)}

function sums(){
  let buy=0,buyN=0,have=0,haveVal=0,bad=0,untested=0;
  for(const it of all()){
    const s=st(it.i),q=qty(it.i),p=price(it.i);
    if(s==='need'){buy+=p*q;buyN++}
    if(s==='have'){have++;haveVal+=p*q;const u=U(it.i);
      if(u.cond==='damaged'||u.cond==='repair')bad++;
      if(!u.tested)untested++}
  }
  return{buy,buyN,have,haveVal,bad,untested};
}

function thumb(it){
  const p=S.photos[it.i];
  return `<div class="thumb" data-cam="${it.i}">${p?`<img src="${p}" alt="">`:art(it)}
    <div class="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></div></div>`;
}
function row(it,mode){
  const u=U(it.i),s=st(it.i);let line='';
  if(mode==='stock'){
    const c=u.cond||'working';
    line=(c!=='working'?`<span class="tag t-bad">${c==='repair'?'needs repair':c}</span>`:`<span class="tag t-have">working</span>`)
      +(u.tested?'':'<span class="tag t-warn">not tested</span>')
      +(u.project?`<span>${esc(u.project)}</span>`:'')
      +(u.loc?`<span>· ${esc(u.loc)}</span>`:'');
  }else{
    line=`<span class="tag t-gray">${LVL[it.l]}</span>`
      +(it.t.indexOf('📘')>=0?'<span class="tag t-need">lab</span>':'')
      +(s==='have'?'<span class="tag t-have">have</span>':'')
      +`<span>${esc(it.d||CATS[it.c])}</span>`;
  }
  const q=qty(it.i),p=price(it.i);
  const right=mode==='stock'?`<div class="pr">×${q}<small>${money(p)}</small></div>`
    :`<div class="pr">${money(p*(s==='need'?q:1))}${s==='need'&&q>1?`<small>${q} × ${money(p)}</small>`:''}</div>`;
  return `<div class="row"><button class="tap" data-id="${it.i}">${thumb(it)}
    <div class="info"><div class="nm">${esc(it.n)}</div><div class="ln">${line}</div></div></button>${right}</div>`;
}
function bind(){
  document.querySelectorAll('.tap[data-id]').forEach(b=>b.onclick=e=>{
    if(e.target.closest('[data-cam]'))return;open(b.dataset.id)});
  document.querySelectorAll('[data-cam]').forEach(t=>t.onclick=e=>{e.stopPropagation();pick(t.dataset.cam)});
  document.querySelectorAll('[data-proj]').forEach(b=>b.onclick=()=>openProject(b.dataset.proj));
}

let camFor=null;
function pick(id){camFor=id;$('#globalCam').click()}
$('#globalCam').onchange=e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f||!camFor)return;
  const id=camFor,rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=async()=>{let w=im.width,h=im.height;const m=900;
      if(w>m||h>m){const r=Math.min(m/w,m/h);w=Math.round(w*r);h=Math.round(h*r)}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      await setPhoto(id,c.toDataURL('image/jpeg',.78));toast('Photo added');
      if($('#sheet').classList.contains('open'))open(id);else render()};
    im.onerror=()=>toast('Could not read that image');im.src=rd.result};
  rd.readAsDataURL(f);
};

function vHome(){
  const s=sums();
  const lv=['B','I','A'].map(L=>{const set=all().filter(x=>x.l===L);
    const h=set.filter(x=>st(x.i)==='have').length;
    return{L:L,h:h,n:set.length,pct:set.length?Math.round(h/set.length*100):0}});
  return `<div class="total"><div class="lbl">I need to spend</div>
    <div class="amt">${money(s.buy)}</div>
    <div class="sub">${s.buyN} item${s.buyN===1?'':'s'} on my buy list</div></div>
  <div class="tiles">
    <div class="tile"><b>${s.have}</b><span>I have</span></div>
    <div class="tile"><b>${money(s.haveVal)}</b><span>stock value</span></div>
    <div class="tile"><b style="color:${s.bad?'var(--red)':'inherit'}">${s.bad}</b><span>damaged</span></div>
  </div>
  <h2>My progress</h2>
  ${lv.map(x=>`<div class="row" style="display:block;padding:14px">
    <div style="display:flex;justify-content:space-between;font-size:14px"><b>${LVL[x.L]}</b><span style="color:var(--ink2)">${x.h} of ${x.n}</span></div>

const PSTAT={idea:['Idea','t-gray'],building:['Building','t-warn'],done:['Finished','t-have'],paused:['Paused','t-gray']};
function projCost(p){return (p.parts||[]).reduce((s,x)=>s+price(x.id)*(x.q||1),0)}
function projMissing(p){return (p.parts||[]).filter(x=>st(x.id)!=='have')}
function projRow(p,i){
  const n=(p.parts||[]).length,miss=projMissing(p).length;
  const s=PSTAT[p.status||'idea'];
  return `<div class="row"><button class="tap" data-proj="${p.id}">
    <div class="thumb">${sym('board')}</div>
    <div class="info"><div class="nm">${esc(p.name)}</div>
    <div class="ln"><span class="tag ${s[1]}">${s[0]}</span>
      <span>${n} part${n===1?'':'s'}</span>
      ${miss?`<span class="tag t-need">${miss} missing</span>`:(n?'<span class="tag t-have">all parts ready</span>':'')}</div></div></button>
    <div class="pr">${money(projCost(p))}</div></div>`;
}
function bar(){
  return `<input class="search" id="q" placeholder="Search components" value="${esc(S.f.q)}">
  <div class="chips"><button class="chip ${!S.f.cat?'on':''}" data-v="">All</button>
  ${Object.keys(CATS).map(k=>`<button class="chip ${S.f.cat===k?'on':''}" data-v="${k}">${CATS[k]}</button>`).join('')}</div>`;
}
function filt(l){const q=S.f.q.trim().toLowerCase();
  return l.filter(it=>(!S.f.cat||it.c===S.f.cat)&&(!q||(it.n+' '+it.d+' '+it.w+' '+CATS[it.c]).toLowerCase().indexOf(q)>=0))}
function vAll(){
  const l=filt(all());
  if(!l.length)return bar()+`<div class="empty"><h3>Nothing found</h3><p>Try another word or clear the filter.</p></div>`;
  const g={};l.forEach(x=>{(g[x.c]=g[x.c]||[]).push(x)});
  return bar()+Object.keys(CATS).filter(k=>g[k]).map(k=>
    `<div class="ghead"><span class="a">${CATS[k]}</span><span class="b">${g[k].length} items</span></div>`
    +g[k].map(x=>row(x)).join('')).join('');
}
function vStock(){
  const owned=all().filter(x=>st(x.i)==='have');
  if(!owned.length)return `<div class="empty"><h3>Your stock is empty</h3>
    <p>Open any component and tap <b>I have it</b>. Then set the quantity, condition and which project it is in.</p>
    <button class="btn" id="goAll">Browse all items</button></div>`;
  const l=filt(owned),val=l.reduce((s,x)=>s+price(x.i)*qty(x.i),0);
  return `<div class="total" style="padding:16px"><div class="lbl">${l.length} items in stock</div>
    <div class="amt" style="font-size:28px">${money(val)}</div></div><div style="height:12px"></div>`
    +bar()+(l.length?l.map(x=>row(x,'stock')).join(''):`<div class="empty"><p>No stock matches this filter.</p></div>`);
}
function vBuy(){

    <button class="btn" id="goAll">Browse all items</button></div>`;

        <button class="pr" style="background:none;border:0;color:var(--red);font-size:20px;cursor:pointer;padding:0 6px" data-rm="${x.id}">×</button></div>`}).join('')

  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async e=>{e.stopPropagation();
    p.parts=(p.parts||[]).filter(x=>x.id!==b.dataset.rm);await save();openProject(pid)});
  $('#addPart').onclick=()=>openPartPicker(pid);
  const bm=$('#buyMiss');if(bm)bm.onclick=async()=>{
    miss.forEach(x=>{S.u[x.id]=Object.assign({},U(x.id),{st:'need',qty:Math.max(qty(x.id),x.q||1)})});
    await save();toast('Added to buy list');openProject(pid)};
  $('#delProj').onclick=async()=>{if(!confirm('Delete this project?'))return;

let pickQ='';
function openPartPicker(pid){

function pinout(it){
  const key=Object.keys(PINS).filter(k=>it.n.toUpperCase().indexOf(k.toUpperCase())>=0)[0];
  if(!key)return '';
  const L=PINS[key],n=L.length;
  if(n===3)return `<div class="pinbox"><div class="h">Pinout — ${key} (front view)</div>
    <svg viewBox="0 0 300 105"><rect x="105" y="10" width="90" height="42" rx="4" fill="#F1F3F6" stroke="#C3C9D2"/>
    ${L.map((l,i)=>{const x=125+i*25;return `<line x1="${x}" y1="52" x2="${x}" y2="76" stroke="#6B7280" stroke-width="3"/><text x="${x}" y="94" fill="#1A1D23" font-size="11" font-family="system-ui" text-anchor="middle">${l}</text>`}).join('')}</svg></div>`;
  const per=n/2,H=30+per*22;
  let s=`<svg viewBox="0 0 300 ${H+14}"><rect x="100" y="14" width="100" height="${per*22}" rx="4" fill="#F1F3F6" stroke="#C3C9D2"/><path d="M139 14a11 11 0 0022 0" fill="none" stroke="#C3C9D2"/>`;
  for(let i=0;i<per;i++){const y=28+i*22,j=n-1-i;
    s+=`<line x1="80" y1="${y}" x2="100" y2="${y}" stroke="#6B7280" stroke-width="2.4"/>
      <text x="75" y="${y+4}" fill="#1A1D23" font-size="10.5" font-family="system-ui" text-anchor="end">${L[i]}</text>
      <text x="106" y="${y+4}" fill="#9AA1AC" font-size="9" font-family="system-ui">${i+1}</text>
      <line x1="200" y1="${y}" x2="220" y2="${y}" stroke="#6B7280" stroke-width="2.4"/>
      <text x="225" y="${y+4}" fill="#1A1D23" font-size="10.5" font-family="system-ui">${L[j]}</text>
      <text x="194" y="${y+4}" fill="#9AA1AC" font-size="9" font-family="system-ui" text-anchor="end">${j+1}</text>`}
  return `<div class="pinbox"><div class="h">Pinout — ${key} (top view, notch up)</div>${s}</svg></div>`;
}

    <label class="f">Add as</label>
    <div class="seg" id="ast"><button data-v="have" class="on">I have it</button><button data-v="need">Need to buy</button></div>
    <div style="height:18px"></div><button class="btn wide" id="sv">Save component</button><div style="height:30px"></div>
  </div>`;
  $('#sheet').classList.add('open');document.body.style.overflow='hidden';
  $('#cl').onclick=close;let start='have';
  $('#ast').querySelectorAll('button').forEach(b=>b.onclick=()=>{start=b.dataset.v;
    $('#ast').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  $('#sv').onclick=async()=>{
    const n=$('#an').value.trim();if(!n){toast('Give it a name first');return}
    const id='u_'+Date.now(),q=+$('#aq').value||1,p=+$('#ap').value||0;
    S.custom.push(I(id,n,$('#ac').value,$('#al').value,$('#as').value,p,q,$('#aw').value.trim(),$('#ad').value.trim(),''));
    S.u[id]={st:start,qty:q,price:p,cond:'working',tested:false};
    await save();close();toast('Added');open(id)};
}

function openMore(){
  $('#sheet').innerHTML=`<div class="sheet-top"><button class="x" id="cl">✕</button><div class="t">More</div></div>
  <div class="sheet-in">
    <label class="f">Photos</label>
    <button class="btn sec wide" id="bulk">Add many photos at once</button>
    <p style="font-size:13px;color:var(--ink2);line-height:1.55;margin-top:8px">
      Pick several image files together. Each file is matched to a component by its file name —
      name a file <b>LM358.jpg</b> or <b>NE555 timer.png</b> and it lands on the right part.</p>
    <input type="file" id="bulkf" accept="image/*" multiple hidden>
    <label class="f">Backup</label>
    <div class="list"><div class="kv"><span class="k">Photos saved</span><span class="v">${Object.keys(S.photos).length}</span></div>
      <div class="kv"><span class="k">My own items</span><span class="v">${S.custom.length}</span></div>
      <div class="kv"><span class="k">Items tracked</span><span class="v">${Object.keys(S.u).length}</span></div>
      <div class="kv"><span class="k">Storage</span><span class="v">${DB.ok?'Saved on device':'Preview only'}</span></div></div>
    <div class="btnrow"><button class="btn" id="ex1">Export backup</button><button class="btn sec" id="im1">Import</button></div>
    <input type="file" id="imf" accept="application/json" hidden>
    <p style="font-size:13px;color:var(--ink2);line-height:1.55">Export keeps your photos and all your data in one file. Do this often — clearing app data will erase everything.</p>
    <label class="f">Reset</label>
    <button class="btn red wide" id="rs">Erase all my data</button><div style="height:30px"></div></div>`;
  $('#sheet').classList.add('open');document.body.style.overflow='hidden';
  $('#cl').onclick=close;
  $('#bulk').onclick=()=>$('#bulkf').click();
  $('#bulkf').onchange=bulkPhotos;
  $('#ex1').onclick=doExport;
  $('#im1').onclick=()=>$('#imf').click();
  $('#imf').onchange=doImport;
  $('#rs').onclick=async()=>{if(!confirm('Erase everything? This cannot be undone.'))return;
    for(const k in S.photos)await dbDel('p:'+k);
    S.u={};S.custom=[];S.photos={};await dbSet('pix',[]);await save();close();toast('All data erased')};
}
function normName(s){return s.toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z0-9]/g,'')}
function shrink(file){return new Promise(res=>{
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{let w=im.width,hh=im.height;const m=900;
      if(w>m||hh>m){const r=Math.min(m/w,m/hh);w=Math.round(w*r);hh=Math.round(hh*r)}
      const c=document.createElement('canvas');c.width=w;c.height=hh;
      c.getContext('2d').drawImage(im,0,0,w,hh);res(c.toDataURL('image/jpeg',.78))};
    im.onerror=()=>res(null);im.src=rd.result};
  rd.onerror=()=>res(null);rd.readAsDataURL(file)})}
async function bulkPhotos(e){
  const files=Array.from(e.target.files||[]);e.target.value='';
  if(!files.length)return;
  toast('Matching '+files.length+' photos…');
  const idx=all().map(it=>({i:it.i,k:normName(it.n)}));
  let hit=0,missNames=[];
  for(const f of files){
    const k=normName(f.name);
    let m=idx.find(x=>x.k===k)||idx.find(x=>x.k.indexOf(k)>=0&&k.length>3)||idx.find(x=>k.indexOf(x.k)>=0&&x.k.length>3);
    if(!m){missNames.push(f.name);continue}
    const d=await shrink(f);
    if(d){await setPhoto(m.i,d);hit++}
  }
  toast(hit+' photo'+(hit===1?'':'s')+' added'+(missNames.length?' · '+missNames.length+' unmatched':''));
  if(missNames.length)alert('These file names did not match any component:\n\n'+missNames.slice(0,15).join('\n')+(missNames.length>15?'\n…':'')+'\n\nRename them to the exact component name and try again, or add those photos one by one.');
  openMore();
}
async function doExport(){
  const d={v:2,at:new Date().toISOString(),u:S.u,custom:S.custom,photos:S.photos};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));
  a.download='my-components-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Backup saved');
}
function doImport(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.u&&!d.user)throw 0;
    S.u=d.u||d.user||{};S.custom=d.custom||[];S.photos=d.photos||{};
    await save();for(const k in S.photos)await dbSet('p:'+k,S.photos[k]);
    await dbSet('pix',Object.keys(S.photos));close();toast('Backup restored')}
    catch(err){toast('That file is not a backup')}};
  r.readAsText(f);
}
function copyList(){
  const l=all().filter(x=>st(x.i)==='need');
  const t='MY SHOPPING LIST\n\n'+l.map(x=>`${x.n} — ${qty(x.i)} pcs — ${money(price(x.i)*qty(x.i))}`).join('\n')
    +`\n\nTOTAL: ${money(l.reduce((s,x)=>s+price(x.i)*qty(x.i),0))}`;
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>toast('Copied')).catch(()=>fb(t));
  else fb(t);
}
function fb(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;
  document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy not available')}
  document.body.removeChild(a)}

$('#fab').onclick=openAdd;
$('#moreBtn').onclick=openMore;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('open'))close()});
boot();
</script>
</body>
</html>
