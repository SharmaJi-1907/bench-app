<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>My Components</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/views-grid.css">
</head>
<body>
<div id="app">
  <main id="main"></main>
</div>
<!-- Cold-start brand animation: covers the first paint, then fades itself out
     once boot() has the data ready. Static markup so it is on screen before any
     JS parses - a JS-built splash would flash the empty app first. -->
<div class="intro" id="intro">
  <div class="intro-in">
    <svg class="intro-chip" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="14" y="14" width="20" height="20" rx="3"/>
      <path d="M20 14V8M24 14V8M28 14V8M20 34v6M24 34v6M28 34v6M14 20H8M14 24H8M14 28H8M34 20h6M34 24h6M34 28h6"/>
    </svg>
    <div class="intro-word">Bench</div>
  </div>
</div>
<nav id="nav"></nav>
<button class="fab" id="fab">+ Add</button>
<div class="sheet" id="sheet"></div>
<div class="qsheet" id="qsheet" aria-hidden="true">
  <div class="scrim" id="qscrim"></div>
  <div class="qpanel" id="qpanel" role="dialog" aria-modal="true" aria-label="Quick edit"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="globalCam" accept="image/*" hidden>

<script src="js/icons.js"></script>
<script src="js/catalog.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/photos.js"></script>
<script src="js/detail.js"></script>
<script src="js/io.js"></script>
<script src="js/main.js"></script>
</body>
</html>
