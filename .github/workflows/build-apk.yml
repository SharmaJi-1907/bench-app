name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  APP_NAME: Bench
  APP_ID: com.bench.inventory

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that index.html is here
        run: |
          test -f index.html || {
            echo "::error::index.html was not found in the top folder of this repo. Upload it there and run again."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Reuse the same signing key every build
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add debug.keystore
            git commit -m "Add signing key so updates install over the old app"
            git push
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Make the Android project
        run: |
          cat > package.json <<'EOF'
          { "name": "bench-app", "version": "1.0.0", "private": true }
          EOF
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/splash-screen@6 @capacitor/haptics@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          node -e "
            const fs=require('fs');
            const p='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            c.plugins={SplashScreen:{launchShowDuration:250,launchAutoHide:true,backgroundColor:'#2563EB',androidSplashResourceName:'splash',showSpinner:false}};
            fs.writeFileSync(p,JSON.stringify(c,null,2));
          "
          mkdir -p www
          cp index.html www/index.html
          cp -r css www/css
          cp -r js www/js
          npx cap add android

      - name: Generate the app icon and splash screen
        run: npx @capacitor/assets generate --android

      - name: Sync the Android project
        run: npx cap sync android

      - name: Allow camera and gallery
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.CAMERA' "$f" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' "$f"

      - name: Build it
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$APP_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Bench.apk

      - name: Put it on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest "$APP_NAME.apk" \
            -t "$APP_NAME — latest APK" \
            -n "Built from index.html on $(date -u '+%d %b %Y, %H:%M UTC'). Tap the .apk file below to install."
